[package]
name = "codex-approval-watcher"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "A hook-driven approval watcher for Codex session logs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
