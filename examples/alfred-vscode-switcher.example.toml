sessions_root = "~/.codex/sessions"
state_file = "~/Library/Application Support/codex-approval-watcher/state/state.json"
event_timeout_ms = 1000

[notifications]
enabled = true
sound = "Sosumi"

[[hooks]]
name = "vscode-switcher-unread"
command = ["/path/to/vscode-switcher/approval_event_hook.sh"]
timeout_ms = 3000
